<script>
/* ============ basics ============ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const r0 = n => Math.round(n);

const DEF_SETTINGS = {

  hardware: [], labourRate: 0, markup: 0, edgeWaste: 10, boardTypes: null,
  materials: [
    { id:'m1', name:'White Melamine 16mm', type:'Melamine on chipboard', t:16, L:2750, W:1830, kerf:4, trim:10, rotate:true },
    { id:'m2', name:'Hardboard 3mm (backs & drawer bottoms)', type:'Hardboard / Masonite', t:3, L:2440, W:1220, kerf:4, trim:5, rotate:true }
  ]
};

const TYPES = {
  base:     { label:'Base unit',      zone:'floor', w:600, doors:1, shelves:1, drawers:0 },
  sink:     { label:'Sink unit',      zone:'floor', w:900, doors:2, shelves:0, drawers:0 },
  drawer:   { label:'Drawer unit',    zone:'floor', w:500, doors:0, shelves:0, drawers:3 },
  wall:     { label:'Wall unit',      zone:'upper', w:600, doors:1, shelves:1, drawers:0 },
  tall:     { label:'Tall / pantry',  zone:'both',  w:600, doors:2, shelves:4, drawers:0 },
  wardrobe: { label:'Wardrobe (BIC)', zone:'both',  w:900, doors:2, shelves:1, drawers:0 },
  cornerBase: { label:'Blind corner base', zone:'floor', w:1000, doors:1, shelves:1, drawers:0, blind:450 },
  cornerWall: { label:'Blind corner wall', zone:'upper', w:900, doors:1, shelves:1, drawers:0, blind:330 }
};
const STATUS = { new:'New', keep:'Keep existing', replace:'Replace existing', ask:'Existing – decide' };
const SHAPES = { straight:['One wall',1], L:['L-shape',2], U:['U-shape',3], rect:['Full room (4 walls)',4] };

/* ============ storage ============ */
const DB = {
  db: null,
  open() { return new Promise(res => { try { const r = indexedDB.open('sawwoodworks', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => res(); } catch(e) { res(); } }); },
  get(k) { return new Promise(res => {
    if (!this.db) { try { res(JSON.parse(localStorage.getItem('sww_'+k))); } catch(e) { res(null); } return; }
    const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  set(k, v) { return new Promise(res => {
    if (!this.db) { try { localStorage.setItem('sww_'+k, JSON.stringify(v)); } catch(e) {} res(); return; }
    const tx = this.db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); }); }
};

let S = { settings: null, projects: [] };
let V = { view:'projects', pid:null, rid:null, tab:'photos', wall:0, sel:null, busy:false, aiMsg:'' };
let saveT;
/* ============ Firebase cloud: root-managed users, per-user jobs, letterheads ============ */
const CLOUD = !!window.FIREBASE_CONFIG;
let ME = null, ROOT = null, DU = null, LH = null, LHD = null, LOCAL = null, USERS = [];
let unsubs = [], dataSubs = [], photoSub = null, photoSubKey = null, pendingRender = false;
let PHOTOS = {};
let SENT = { projects:{}, settings:'' };
const isRoot = () => CLOUD && !!ME && ME.role === 'root';
const dataUid = () => (isRoot() && V.as) || (ME && ME.uid);
const lhVisible = () => CLOUD && !!ME && (isRoot() || (DU && !DU.lhLocked));
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { saveT = null; if (CLOUD) { if (ME && ME.role) cloudFlush(); } else DB.set('state', JSON.parse(JSON.stringify(S))); }, 250);
}
const cpath = (...p) => ['users', dataUid(), ...p].join('/');
const fbErr = e => { console.error(e); toast('⚠ Could not save to the server: ' + (e.code || e.message)); };
function toast(t) { let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#3a352d;color:var(--ink);border:1px solid var(--line);padding:9px 14px;border-radius:8px;z-index:30;font-size:14px;max-width:90vw'; document.body.appendChild(el); } el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 4500); }
function cloudSettings() { const s = { ...S.settings }; delete s.user; delete s.agreed; return JSON.stringify(s); }
function defaultSettings() { const s = mergeSettings(null); delete s.user; delete s.agreed; return JSON.parse(JSON.stringify(s)); }
function cloudFlush() {
  const { F, db } = FB, ids = new Set();
  S.projects.forEach(p => {
    ids.add(p.id); const j = JSON.stringify(p);
    if (SENT.projects[p.id] !== j) { SENT.projects[p.id] = j; F.setDoc(F.doc(db, cpath('projects', p.id)), JSON.parse(j)).catch(fbErr); }
  });
  Object.keys(SENT.projects).forEach(id => { if (!ids.has(id)) { delete SENT.projects[id]; F.deleteDoc(F.doc(db, cpath('projects', id))).catch(fbErr); deleteProjectPhotos(id); } });
  const st = cloudSettings();
  if (st !== SENT.settings) { SENT.settings = st; F.updateDoc(F.doc(db, 'users/' + dataUid()), { settings: JSON.parse(st) }).catch(fbErr); }
}
async function deleteProjectPhotos(pid) {
  const { F, db } = FB;
  try { const qs = await F.getDocs(F.query(F.collection(db, cpath('photos')), F.where('pid', '==', pid))); qs.docs.forEach(d => F.deleteDoc(d.ref).catch(() => {})); } catch (e) {}
}
function softRender() {
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !$('#modal').contains(a)) { pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', () => { if (pendingRender) setTimeout(() => { const a = document.activeElement; if (!pendingRender || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !$('#modal').contains(a))) return; pendingRender = false; render(); }, 0); });

/* ---- passwords: letters + numbers + special characters ---- */
function pwProblem(p) {
  if (!p || p.length < 8) return 'Password must be at least 8 characters.';
  if (!/[A-Za-z]/.test(p)) return 'Password must contain at least one letter.';
  if (!/[0-9]/.test(p)) return 'Password must contain at least one number.';
  if (!/[^A-Za-z0-9]/.test(p)) return 'Password must contain at least one special character, e.g. ! @ # $ % & * ?';
  return null;
}
function genPw() {
  const sets = ['ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '!@#$%&*?'];
  const r = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
  const a = sets.map(s => s[r(s.length)]);
  while (a.length < 12) { const s = sets[r(4)]; a.push(s[r(s.length)]); }
  for (let i = a.length - 1; i > 0; i--) { const j = r(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a.join('');
}
const PW_HINT = 'At least 8 characters, with letters, numbers and a special character (e.g. ! @ # $ %).';

/* ---- example jobs every new account starts with ---- */
function demoProjects() {
  const R0 = DEF_SETTINGS.rules, id = () => uid() + uid();
  const U = (type, x, w, extra = {}) => { const t = TYPES[type];
    return { id:id(), type, x, w, h: type==='wall' ? R0.wallH : (t.zone==='both' ? R0.tallH : R0.baseH), d: type==='wall' ? R0.wallD : (t.zone==='both' ? R0.tallD : R0.baseD),
      elev: type==='wall' ? R0.wallElev : 0, doors:t.doors, shelves:t.shelves, drawers:t.drawers, status:'new', ...extra }; };
  const W = (label, length, extra = {}) => ({ id:id(), label, length, height:2400, turn:'right', openings:[], units:[], ...extra });
  const now = new Date().toISOString();
  const kA = W('A', 3600, { openings:[{ id:id(), type:'window', x:1300, w:1000, h:1000, sill:1100 }],
    units:[U('drawer',0,500), U('base',500,600), U('sink',1100,900), U('base',2000,600), U('base',2600,1000,{doors:2}),
           U('wall',0,500), U('wall',500,600), U('wall',2400,600), U('wall',3000,600)] });
  const kB = W('B', 2600, { openings:[{ id:id(), type:'door', x:1700, w:813, h:2032, sill:0 }],
    units:[U('tall',0,600), U('base',600,600,{status:'keep'}), U('wall',600,600)] });
  const bA = W('A', 2700, { units:[U('wardrobe',0,900), U('wardrobe',900,900,{drawers:2}), U('wardrobe',1800,900)] });
  return [{ id:id(), name:'Example – Smith kitchen & bedroom', client:'Example client', addr:'12 Sample Street', created:now, updated:now, example:true,
    rooms:[{ id:id(), name:'Kitchen', photos:[], shape:'L', walls:[kA, kB], ai:null, mats:null },
           { id:id(), name:'Main bedroom BIC', photos:[], shape:'straight', walls:[bA], ai:null, mats:null }] }];
}

/* ---- start / auth ---- */
function startCloud() {
  FB.A.onAuthStateChanged(FB.auth, async u => {
    unsubs.forEach(f => f()); unsubs = []; detachData();
    ME = null; ROOT = null; USERS = []; V.as = null;
    if (!u) { modal(''); go('login'); refreshRootFlag(); return; }
    ME = { uid:u.uid, email:u.email };
    await loadMe();
  });
}
async function refreshRootFlag() {
  try { const c = await FB.F.getDoc(FB.F.doc(FB.db, 'config/app')); ROOT = c.exists() ? c.data().root : null; } catch (e) { ROOT = 'unknown'; }
  if (V.view === 'login') render();
}
async function loadMe() {
  const { F, db } = FB;
  try { const c = await F.getDoc(F.doc(db, 'config/app')); ROOT = c.exists() ? c.data().root : null; } catch (e) { ROOT = null; }
  let us = null; try { us = await F.getDoc(F.doc(db, 'users/' + ME.uid)); } catch (e) {}
  if (!us || !us.exists()) { go(ROOT ? 'noaccess' : 'bootstrap'); return; }
  Object.assign(ME, us.data());
  if (ME.active === false) { go('blocked'); return; }
  S.settings = mergeSettings(ME.settings); S.settings.user = ME.name; S.settings.agreed = ME.agreed || null;
  if (isRoot()) unsubs.push(F.onSnapshot(F.collection(db, 'users'), qs => { USERS = qs.docs.map(d => ({ uid:d.id, ...d.data() })); if (V.view === 'users') softRender(); }, () => {}));
  attachData(true);
}
function detachData() { dataSubs.forEach(f => f()); dataSubs = []; if (photoSub) photoSub(); photoSub = null; photoSubKey = null;
  S.projects = []; SENT = { projects:{}, settings:'' }; PHOTOS = {}; DU = null; LH = null; LHD = null; }
function attachData(first) {
  detachData();
  const { F, db } = FB, u = dataUid();
  let gotUser = false;
  dataSubs.push(F.onSnapshot(F.doc(db, 'users/' + u), snap => {
    DU = snap.data() || {};
    if (u === ME.uid) {
      Object.assign(ME, DU);
      if (DU.active === false) { toast('Your account has been blocked. Contact the administrator.'); FB.A.signOut(FB.auth); return; }
    }
    if (!saveT || cloudSettings() === SENT.settings) {
      S.settings = Object.assign(mergeSettings(DU.settings), { user:ME.name, agreed:ME.agreed || null });
      SENT.settings = cloudSettings();
    }
    if (!gotUser) { gotUser = true;
      if (first) { V.view = (!isRoot() && !DU.lhLocked) ? 'letterhead' : 'projects'; render(); termsGate(); } else render();
    } else softRender();
  }, e => toast('Server error: ' + e.code)));

/* --- cabinet template formulas (Optimik): dim 1=width 2=height 3=depth; op 1 = minus, 10 = plus, 2..9 = divide by N, 11+ = times (N-9); values in 1/100 mm --- */
function tplEval(f, X, Y, Z, def) {
  if (!f) return def;
  const t = f.split(' ').map(Number); let v = { 0:0, 1:X, 2:Y, 3:Z }[t[0]]; if (v === undefined) return def;
  for (let i = 1; i + 1 < t.length; i += 2) { const o = t[i], a = t[i + 1] / 100;
    if (!o) continue; if (o === 1) v -= a; else if (o === 10) v += a; else if (o >= 2 && o <= 9) v = a ? v / a : v / o; else if (o >= 11) v *= (o - 9); }

}

  lib.jobs.forEach(x => { const n = add(x.id, x); index.jobs.push({ id:x.id, name:x.name, date:x.date, np:x.parts.length, chunk:n }); });

  const add = (name, L, Wd, qty, role='carcass', edge) => { if (qty > 0 && L > 0 && Wd > 0) out.push({ name, L:r0(L), W:r0(Wd), qty, role, edges: edge !== undefined ? EDGE[edge] : (role === 'doors' ? EDGE.all : role === 'backs' ? '' : EDGE.front) }); };

  for (let i = 0; i < w.units.length; i++) for (let j = i+1; j < w.units.length; j++) {
    const a = w.units[i], b = w.units[j];
    if (!lanes(a).some(l => lanes(b).includes(l))) continue;
    if (+a.x < +b.x + +b.w && +b.x < +a.x + +a.w) out.push(['bad', `${unitRef(w,a)} and ${unitRef(w,b)} overlap.`]);

}

function setAiModel(m) { if (CLOUD) { CAI.model = m; if (isRoot()) FB.F.setDoc(FB.F.doc(FB.db, 'config/ai'), { model: m }, { merge: true }).catch(fbErr); } else { S.settings.model = m; save(); } }

function apiHeaders() { return { 'content-type':'application/json', 'x-api-key':S.settings.apiKey.trim(), 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' }; }
const gHeaders = () => ({ 'content-type':'application/json', 'x-goog-api-key': aiKey() });

let GMODE = 0;
async function gFetch(url, body) {
  const key = aiKey(), modes = [GMODE, 0, 1, 2].filter((m, i, a) => a.indexOf(m) === i);
  let last;
  for (const m of modes) {
    const h = { 'content-type': 'application/json' };
    if (m === 0) h['x-goog-api-key'] = key; else if (m === 2) h.Authorization = 'Bearer ' + key;
    const u = m === 1 ? url + (url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(key) : url;
    const r = await fetch(u, body ? { method: 'POST', headers: h, body } : { headers: h });
    if (r.status !== 401 && r.status !== 403) { GMODE = m; return r; }
    if (m === 0 || !last) last = r;

}
function gErr(j, status) {
  const m = (j && j.error && j.error.message) || ('HTTP ' + status);
  if (status === 429) return 'free daily limit reached — try again later';
  if (/unregistered callers|ACCESS_TOKEN_TYPE_UNSUPPORTED|API key not valid|OAuth 2|PERMISSION_DENIED|referer|blocked/i.test(m)) return '(Google says: ' + m + ') Google did not accept this AI key. Keys starting with "AQ." often don\'t work — make a key starting with "AIza" instead (Google Cloud console → APIs & Services → Credentials → Create credentials → API key, on the same project) and paste it in Settings → AI photo reading.';
  return m;
}
async function pickModel(force) {
  if (aiModel() && !force) return aiModel();
  let m;
  if (aiProvider() === 'anthropic') {
    const r = await fetch('https://api.anthropic.com/v1/models?limit=50', { headers: apiHeaders() });
    const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || ('HTTP ' + r.status));
    const ids = (j.data || []).map(x => x.id);
    m = ids.find(i => /sonnet/i.test(i)) || ids[0];
  } else {
    const r = await gFetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200');
    const j = await r.json(); if (!r.ok) throw new Error(gErr(j, r.status));
    const ok = (j.models || []).filter(x => (x.supportedGenerationMethods || []).includes('generateContent'))
      .map(x => x.name.replace('models/', ''))
      .filter(n => /^gemini-[\d.]+-flash/.test(n) && !/image|tts|live|audio|thinking|exp|lite/.test(n));
    const ver = n => parseFloat((n.match(/gemini-([\d.]+)/) || [0, 0])[1]);
    ok.sort((a, b) => ver(b) - ver(a) || (/preview/.test(a) - /preview/.test(b)) || a.length - b.length);
    m = ok[0];

  setAiModel(m); return m;
}
async function aiRead() {
  const r = R();
  if (!aiKey()) { V.aiMsg = CLOUD ? (isRoot() ? 'Add the company Google Gemini key in Settings → AI photo reading first.' : 'AI photo reading has not been switched on yet — ask the administrator. You can still type the sizes in by hand.') : 'Add your free Google Gemini key in Settings first.'; return render(); }
  V.busy = true; V.aiMsg = ''; render();
  try {
    const model = await pickModel();
    const prompt = `You are helping a South African cabinet maker measure a room for built-in cupboards. These photos show one room (ideally one photo per wall). Work out:
- how many walls will get cupboards (1 = straight, 2 = L-shape, 3 = U-shape, 4 = full room), labelled A, B, C, D going clockwise, starting with the wall in the first photo
- for each wall: estimated length and ceiling height in mm, doors and windows (offset from the LEFT end of the wall as seen from inside the room, width, height, and sill height for windows)
- existing cupboards on each wall: type (base, sink, drawer, wall, tall, wardrobe), offset from the left in mm, width in mm, number of doors and drawers
Use common sizes as scale references: internal doors are about 813 wide x 2032 high, kitchen worktops about 900 from the floor, base units about 560 deep, wall units about 720 high. If you cannot tell a value, use null. Round to the nearest 10 mm.
Reply with ONLY JSON, no other text, in this shape:
{"walls":[{"label":"A","lengthMm":3200,"heightMm":2400,"openings":[{"type":"door","offsetMm":0,"widthMm":813,"heightMm":2032,"sillMm":0}],"existing":[{"type":"base","offsetMm":900,"widthMm":600,"doors":1,"drawers":0}]}],"notes":"short notes on anything the cabinet maker must measure or check"}`;
    const photos = r.photos.map(photoSrc).filter(Boolean).slice(0, 8).map(d => d.split(',')[1]);
    if (!photos.length) throw new Error('photos are still loading — try again in a moment');
    let txt = '';
    if (aiProvider() === 'anthropic') {
      const resp = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers: apiHeaders(),
        body: JSON.stringify({ model, max_tokens: 3000, messages:[{ role:'user', content:[...photos.map(data => ({ type:'image', source:{ type:'base64', media_type:'image/jpeg', data } })), { type:'text', text:prompt }] }] }) });
      const j = await resp.json(); if (!resp.ok) throw new Error(j.error?.message || ('HTTP ' + resp.status));
      txt = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
    } else {
      const resp = await gFetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,
        JSON.stringify({ contents:[{ role:'user', parts:[...photos.map(data => ({ inline_data:{ mime_type:'image/jpeg', data } })), { text:prompt }] }],

function applyAI(r, js) {

function curWall() { return R().walls[V.wall]; }
function addUnit(type) { const w = curWall(), u = unitDefaults(type); u.x = laneEnd(w, type); w.units.push(u); V.sel = u.id; touch(); render(); }

function setUnit(j, f, v) {

/* ============ quick board calculator (no rooms or walls) ============ */

function calcDeleteList(id) { if (!confirm('Delete this saved project?')) return; S.settings.calcLists = CALCLISTS().filter(x => x.id !== id); if (V.calcListId === id) V.calcListId = null; save(); render(); }

/* ---- board types & the "add a board" picker ---- */
function boardTypes() { return S.settings.boardTypes || BOARD_TYPES; }
function editBoardTypes() { if (!S.settings.boardTypes) S.settings.boardTypes = JSON.parse(JSON.stringify(BOARD_TYPES)); return S.settings.boardTypes; }
const parseNums = v => String(v).split(/[,;\s]+/).map(x => +x.replace(',', '.')).filter(x => x > 0);
const parseSizes = v => String(v).split(/[,;]+/).map(x => x.trim().toLowerCase().replace(/\s/g, '').replace('×', 'x')).filter(x => /^\d+x\d+$/.test(x));
function openBoardPicker(forWhat) {
  const t0 = boardTypes()[0];
  V.bp = { for: forWhat || '', type: 0, t: t0.t.includes(16) ? 16 : t0.t[0], size: t0.sizes[0], L: '', W: '', tc: '', colour: '', price: '' };
  bpRender();
}
function bpSet(k, v) {
  const b = V.bp; b[k] = v;
  if (k === 'type') { const ty = boardTypes()[+v] || {}; if (!(ty.t || []).includes(+b.t)) b.t = (ty.t || [])[0] || 'custom'; if (!(ty.sizes || []).includes(b.size)) b.size = (ty.sizes || [])[0] || 'custom'; }
  bpRender();
}
function bpRender() {
  const b = V.bp, types = boardTypes(), ty = types[+b.type] || types[0];
  modal(`<h3 style="margin-top:0">Add a board</h3>
    <div class="row">
      <div><label>Type</label><select onchange="bpSet('type',this.value)">${types.map((x, i) => `<option value="${i}" ${+b.type === i ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div><label>Thickness</label><select onchange="bpSet('t',this.value)">${ty.t.map(t => `<option value="${t}" ${+b.t === t ? 'selected' : ''}>${t} mm</option>`).join('')}<option value="custom" ${b.t === 'custom' ? 'selected' : ''}>Other…</option></select></div>
      ${b.t === 'custom' ? `<div><label>Thickness (mm)</label><input type="number" style="width:80px" value="${esc(b.tc)}" oninput="V.bp.tc=this.value"></div>` : ''}
      <div><label>Sheet size (mm)</label><select onchange="bpSet('size',this.value)">${ty.sizes.map(z => `<option value="${z}" ${b.size === z ? 'selected' : ''}>${z.replace('x', ' × ')}${/^3660|^3050/.test(z) ? ' (long)' : ''}</option>`).join('')}<option value="custom" ${b.size === 'custom' ? 'selected' : ''}>Other size…</option></select></div>
      ${b.size === 'custom' ? `<div><label>Length</label><input type="number" style="width:90px" value="${esc(b.L)}" oninput="V.bp.L=this.value"></div><div><label>Width</label><input type="number" style="width:90px" value="${esc(b.W)}" oninput="V.bp.W=this.value"></div>` : ''}
    </div>
    <div class="row" style="margin-top:8px">
      <div style="flex:1;min-width:200px"><label>Colour / name (optional)</label><input style="width:100%" placeholder="e.g. White, Grey Fleece, Pine, Birch" value="${esc(b.colour)}" oninput="V.bp.colour=this.value"></div>
      <div><label>Price per sheet (R)</label><input type="number" style="width:110px" value="${esc(b.price)}" oninput="V.bp.price=this.value"></div>
    </div>
    <p class="small muted">${ty.rotate ? 'Parts may be turned on this board to save waste.' : 'Grain board — parts keep their grain along the sheet length.'} Add more types, thicknesses or sizes under Settings → Board types.</p>
    <div class="row"><button class="primary" onclick="bpAdd()">+ Add board</button><button onclick="modal('')">Cancel</button></div>`);
}
function bpAdd() {
  const b = V.bp, ty = boardTypes()[+b.type];
  const t = b.t === 'custom' ? +b.tc : +b.t;
  let L, W; if (b.size === 'custom') { L = +b.L; W = +b.W; } else [L, W] = b.size.split('x').map(Number);
  if (!t || !L || !W) { toast('Fill in the thickness and sheet size.'); return; }
  if (W > L) [L, W] = [W, L];
  const name = `${b.colour.trim() ? b.colour.trim() + ' ' : ''}${ty.name.replace(/\s*\(grain\)/, '')} ${t}mm${(L !== 2750 || W !== 1830) ? ` ${L}×${W}` : ''}`;
  const same = S.settings.materials.find(m => m.name === name && m.L === L && m.W === W);
  let id = same && same.id;
  if (!same) { id = uid(); S.settings.materials.push({ id, name, type: ty.name, t, L, W, kerf: 4, trim: 10, rotate: !!ty.rotate, price: +b.price || 0 }); }
  if (b.for === 'calc') V.cqMat = id;
  save(); modal(''); toast(same ? 'That board is already in your list — selected it.' : 'Board added: ' + name); render();
}
function boardTypesCard() {

async function catPageImage(pdf, n) {
  const pg = await pdf.getPage(n), v0 = pg.getViewport({ scale: 1 }), sc = Math.min(2, 1600 / Math.max(v0.width, v0.height)), vp = pg.getViewport({ scale: sc });
  const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height);

async function catReadPage(n) {

For each product give the part number exactly as printed, a short description, the kind (runner, drawer side, hinge, bracket, fixing, other), the key printed specs (nominal lengths, heights, load ratings, opening angle, overlay/inset type, drilling or installation distances) and any note about which front, door or carcass thickness it suits. Use ONLY what is printed on the page. If something is not shown, leave it empty. Do not guess numbers.
Reply with ONLY JSON: {"items":[{"code":"","desc":"","kind":"","specs":"","suits":""}]}`;
  try {

      const resp = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: apiHeaders(), body: JSON.stringify({ model, max_tokens: 3000, messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: img } }, { type: 'text', text: prompt }] }] }) });

  V.busy = false; render();
}

/* ============ drag and drop: drop files anywhere on the page, they go to the right place for the open screen ============ */
let DROP_DEPTH = 0;
const dropHasFiles = e => !!e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
function dropHint(show) {
  let h = document.getElementById('dropHint');
  if (!h) { h = document.createElement('div'); h.id = 'dropHint'; h.style.cssText = 'display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.55);color:#fff;align-items:center;justify-content:center;font-size:22px;pointer-events:none;border:4px dashed var(--accent);box-sizing:border-box';
    h.textContent = 'Drop the file here'; document.body.appendChild(h); }
  h.style.display = show ? 'flex' : 'none';
}
function dropFiles(files) {
  const list = [...(files || [])];
  const pdfs = list.filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  const imgs = list.filter(f => f.type.startsWith('image/'));
  const drawings = [...imgs, ...pdfs];
  if (V.view === 'catalogues') { if (pdfs.length) catUpload(pdfs); else toast('Drop a catalogue PDF here.'); return; }
  if (V.view === 'items') { if (drawings.length) importDrawing(drawings); else toast('Drop a drawing photo or PDF here.'); return; }
  if (V.view === 'item') { if (drawings.length) attachItemFiles(drawings); else toast('Drop a drawing photo or PDF here.'); return; }
  if ((V.view === 'project' || V.view === 'room') && imgs.length) { if (V.view === 'room' && R()) addPhotos(imgs); else toast('Open a room to drop photos into it.'); return; }
  toast('Open a drawing, a catalogue or a room, then drop the file.');
}
window.addEventListener('dragenter', e => { if (!dropHasFiles(e)) return; e.preventDefault(); DROP_DEPTH++; dropHint(true); });
window.addEventListener('dragover', e => { if (!dropHasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
window.addEventListener('dragleave', e => { if (!dropHasFiles(e)) return; DROP_DEPTH = Math.max(0, DROP_DEPTH - 1); if (DROP_DEPTH === 0) dropHint(false); });
window.addEventListener('drop', e => { if (!dropHasFiles(e)) return; e.preventDefault(); DROP_DEPTH = 0; dropHint(false); dropFiles(e.dataTransfer.files); });

      <td><select onchange="itemSet('parts.${i}.eL',+this.value)">${cnt(p.eL)}</select></td><td><select onchange="itemSet('parts.${i}.eW',+this.value)">${cnt(p.eW)}</select></td>
      <td><input type="checkbox" ${p.grain ? 'checked' : ''} onchange="itemSet('parts.${i}.grain',this.checked)"></td>
      <td class="noprint"><button class="small" title="Copy" onclick="IT().parts.splice(${i + 1},0,{...IT().parts[${i}],id:uid()});save();render()">⧉</button><button class="small danger" onclick="IT().parts.splice(${i},1);save();render()">✕</button></td></tr>`).join('')}
    </table></div>
    <div class="row noprint" style="margin-top:8px"><button class="small" onclick="IT().parts.push({id:uid(),name:'Part',qty:'1',L:'',W:'',matId:(IT().parts.at(-1)||{}).matId||S.settings.roles.carcass,edge:'',eL:0,eW:0,grain:false});save();render()">+ Add part</button>
      <button class="small" onclick="openBoardPicker()">+ New board</button></div></div>
  ${good.length ? `<h2>Cutting list</h2><div class="card"><div class="tablewrap"><table><tr><th>Part</th><th>Qty</th><th>Length</th><th>Width</th><th>Thick</th><th>Board</th><th>Edging</th></tr>
      ${good.map(p => `<tr><td>${esc(p.name)}</td><td>${p.qty}</td><td><b>${p.L}</b></td><td><b>${p.W}</b></td><td>${(mat(p.matId) || {}).t || ''}</td><td class="small">${esc((mat(p.matId) || {}).name || '?')}</td><td class="small">${p.edge ? `${esc(edgeName(p.edge))} ${p.eL}L ${p.eW}S` : ''}</td></tr>`).join('')}</table></div></div>
    <h2>Boards needed</h2>${boardsSummary(packs)}${edgeTable(good)}
    ${boardCost || edgeCost ? `<div class="card"><b>Material cost:</b> boards R ${boardCost.toFixed(2)}${edgeCost ? ` + edging R ${edgeCost.toFixed(2)}` : ''} = <b>R ${(boardCost + edgeCost).toFixed(2)}</b></div>` : ''}
    <h2>Cutting layouts</h2>${packs.map(x => x.bins.map((b, i) => `<div class="card"><b>${esc(x.m.name)} — sheet ${i + 1} of ${x.bins.length}</b> <span class="muted small">(${x.m.L} × ${x.m.W}, kerf ${x.k} mm)</span>${sheetSVG(x, b, i)}</div>`).join('')).join('')}
    <details><summary class="noprint" style="cursor:pointer;margin:6px 0">Show part drawings</summary>${partDrawings(good.map(p => ({ ...p, g: it.name })), 'g')}</details>` : ''}`;
}
async function attachItemFiles(files) {
  const it = IT(); V.busy = true; render();
  try { for (const f of files) { const imgs = /pdf/i.test(f.type) || /\.pdf$/i.test(f.name) ? await pdfToImages(f) : [await imgToJpeg(f)]; for (const d of imgs.filter(Boolean)) await storeItemFile(it, d); } }
  catch (e) { toast('Could not attach: ' + e.message); }
  V.busy = false; save(); render();
}
function itemToCalc() {
  const it = IT(), ps = itemParts(it).filter(p => !p.bad);
  ps.forEach(p => CALC().parts.push({ id: uid(), name: `${p.name} (${it.name})`.slice(0, 80), L: p.L, W: p.W, qty: p.qty, matId: p.matId, edge: p.edge || '', eL: +p.eL || 0, eW: +p.eW || 0, grain: !!p.grain }));
  save(); toast(`${ps.length} part line(s) added to the Board calculator.`); go('calc');
}
function itemToProject() {
  if (!S.projects.length) { toast('Make a project first.'); return; }
  modal(`<h3 style="margin-top:0">Add "${esc(IT().name)}" to a project</h3><p class="small muted">The parts go into the room's loose parts, so they're in its boards, cutting list and quotation.</p>
    <div class="row"><div><label>Project</label><select id="itP" onchange="document.getElementById('itR').innerHTML=S.projects.find(p=>p.id===this.value).rooms.map(r=>'<option value='+r.id+'>'+esc(r.name)+'</option>').join('')+'<option value=new>+ New room</option>'">${S.projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
    <div><label>Room</label><select id="itR">${S.projects[0].rooms.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join('')}<option value="new">+ New room</option></select></div></div>
    <div class="row" style="margin-top:10px"><button class="primary" onclick="itemToProjectGo()">Add</button><button onclick="modal('')">Cancel</button></div>`);
}
function itemToProjectGo() {
  const it = IT(), p = S.projects.find(x => x.id === $('#itP').value); let rid = $('#itR').value, r;
  if (rid === 'new') { r = { id: uid(), name: it.name, photos: [], shape: 'straight', walls: [newWall(0)], ai: null, mats: null }; p.rooms.push(r); } else r = p.rooms.find(x => x.id === rid);
  r.parts = r.parts || [];
  itemParts(it).filter(x => !x.bad).forEach(x => r.parts.push({ id: uid(), name: x.name, L: x.L, W: x.W, qty: x.qty, matId: x.matId, set: it.name, edges: x.edges, grain: !!x.grain }));
  modal(''); V.pid = p.id; touch(); toast('Added to ' + p.name + ' → ' + r.name); go('room', { pid: p.id, rid: r.id, tab: 'cut' });
}

/* ---------- settings ---------- */
function viewSettings() {
  const s = S.settings, Rl = s.rules;
  const rule = (k, l) => `<div><label>${l}</label><input type="number" value="${Rl[k]}" onchange="S.settings.rules['${k}']=num(this.value)??0;save()"></div>`;
  return `${CLOUD ? asBanner() : ''}<h1>Settings</h1>${accountCard()}${pricesCard()}
  <div class="card"><h3 style="margin-top:0">Build rules (mm)</h3><p class="small muted">How your cupboards are made. Sides run full height; tops, bottoms and shelves fit between the sides; backs are nailed on full size.</p>
    <div class="row">${rule('t','Board thickness')}${rule('back','Back thickness')}${rule('kick','Kick height')}${rule('worktop','Worktop thickness')}${rule('railW','Top rail width')}${rule('shelfSet','Shelf set-back')}${rule('gap','Door gap')}</div>
    <div class="row" style="margin-top:8px">${rule('baseH','Base carcass height')}${rule('baseD','Base depth')}${rule('wallH','Wall unit height')}${rule('wallD','Wall unit depth')}${rule('wallElev','Wall unit height off floor')}${rule('tallH','Tall carcass height')}${rule('tallD','Tall depth')}</div>
    <div class="row" style="margin-top:8px">${rule('slide','Drawer runner clearance (total)')}${rule('drawerClear','Drawer box below front')}</div>
    <div style="margin-top:8px"><button class="small" onclick="if(confirm('Reset build rules to defaults?')){S.settings.rules=JSON.parse(JSON.stringify(DEF_SETTINGS.rules));save();render()}">Reset to defaults</button></div></div>
  <div class="card"><h3 style="margin-top:0">Board materials</h3><div class="tablewrap"><table><tr><th>Name</th><th>Thickness</th><th>Length</th><th>Width</th><th>Saw kerf</th><th>Edge trim</th><th>Can rotate</th><th></th></tr>
    ${s.materials.map((m, i) => `<tr><td><input value="${esc(m.name)}" style="width:240px" onchange="S.settings.materials[${i}].name=this.value;save()"></td>
      ${['t','L','W','kerf','trim'].map(f => `<td><input type="number" value="${m[f]}" onchange="S.settings.materials[${i}]['${f}']=num(this.value)??0;save()"></td>`).join('')}
      <td><input type="checkbox" ${m.rotate?'checked':''} onchange="S.settings.materials[${i}].rotate=this.checked;save()"></td>
      <td><button class="small danger" onclick="delMat(${i})">✕</button></td></tr>`).join('')}</table></div>
    <div class="row" style="margin-top:8px"><button class="small primary" onclick="openBoardPicker()">+ Add board (type, thickness, size)</button>
    <button class="small" onclick="S.settings.materials.push({id:uid(),name:'New board',t:16,L:2750,W:1830,kerf:4,trim:10,rotate:true});save();render()">+ Add blank row</button></div>
    <p class="small muted" style="margin-bottom:0">Cupboards use the thickness of the carcass and backs boards you pick for each room.</p>
    <div class="row" style="margin-top:10px">${['carcass','doors','backs'].map(role => `<div><label>Default ${role === 'backs' ? 'backs' : role} board</label><select onchange="S.settings.roles['${role}']=this.value;save()">${s.materials.map(m => `<option value="${m.id}" ${s.roles[role]===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>`).join('')}</div></div>
  ${boardTypesCard()}
  ${CLOUD ? aiCompanyCard() : `<div class="card"><h3 style="margin-top:0">AI photo reading</h3>
    <div class="row"><div><label>AI service</label><select onchange="S.settings.provider=this.value;S.settings.model='';save();render()">
      <option value="gemini" ${s.provider!=='anthropic'?'selected':''}>Google Gemini — free</option>
      <option value="anthropic" ${s.provider==='anthropic'?'selected':''}>Anthropic Claude — paid</option></select></div></div>
    ${s.provider !== 'anthropic' ? `<p class="small muted">Free key: go to <b>aistudio.google.com</b>, sign in with a Google account, click <b>Get API key → Create API key</b>, and paste it below. No card needed. The free tier has a daily limit, and Google may use free-tier photos to improve its products.</p>
    <div class="row"><div style="flex:1;min-width:240px"><label>Google Gemini API key</label><input type="password" style="width:100%" value="${esc(s.geminiKey||'')}" placeholder="Paste your key here (starts with AQ. or AIza)" onchange="S.settings.geminiKey=this.value.trim();S.settings.model='';save()"></div>`
    : `<p class="small muted">Get a key at console.anthropic.com — usage is billed to that account.</p>
    <div class="row"><div style="flex:1;min-width:240px"><label>Anthropic API key</label><input type="password" style="width:100%" value="${esc(s.apiKey)}" placeholder="sk-ant-…" onchange="S.settings.apiKey=this.value.trim();S.settings.model='';save()"></div>`}
    <div><label>Model</label><input value="${esc(s.model)}" placeholder="auto" onchange="S.settings.model=this.value.trim();save()" style="width:220px"></div>
    <button onclick="testKey()">Test key</button></div><div class="small muted">Keys are stored only on this device.</div><div id="keyMsg">${V.keyMsg || ''}</div></div>`}
  ${!CLOUD ? libraryUploadCard() : ''}
  <div class="card"><h3 style="margin-top:0">Backup</h3><div class="row">
    <button onclick="exportData()">⬇ Download backup</button>
    <label class="btn">⬆ Restore backup<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])"></label></div></div>
  <div class="card"><h3 style="margin-top:0">Terms &amp; Conditions</h3><p class="small">Accepted by <b>${esc(s.agreed?.by||'')}</b> on ${esc((s.agreed?.at||'').slice(0,10))}.</p>
    <details><summary>Read terms</summary><div class="terms">${TERMS_HTML()}</div></details></div>`;
}
function delMat(i) {
  const m = S.settings.materials[i];
  if (S.settings.materials.length < 2) return alert('You need at least one material.');
  if (!confirm('Delete ' + m.name + '?')) return;
  S.settings.materials.splice(i, 1);
  const first = S.settings.materials[0].id;
  Object.keys(S.settings.roles).forEach(k => { if (S.settings.roles[k] === m.id) S.settings.roles[k] = first; });
  save(); render();
}
function aiCompanyCard() {
  if (!isRoot()) return `<div class="card"><h3 style="margin-top:0">AI photo reading</h3>
    ${CAI.key ? '<p class="small" style="margin:0">✅ Switched on for you by the administrator. Open a room → Photos → <b>Read photos with AI</b>.</p>'
      : '<p class="small muted" style="margin:0">Not switched on yet — the administrator sets this up for everyone. You can still type sizes in by hand.</p>'}</div>`;
  return `<div class="card"><h3 style="margin-top:0">AI photo reading — company key</h3>
    <p class="small muted">One Google Gemini key for the whole company. Every user's photo reading runs on it. Users never see this box and cannot add or change keys. Free key: <b>aistudio.google.com</b> → <b>Get API key</b>.</p>
    <div class="row"><div style="flex:1;min-width:240px"><label>Company Google Gemini API key ${CAI.key ? '<span style="color:var(--ok)">● saved</span>' : '<span style="color:var(--warn)">● not set</span>'}</label>
      <input type="password" style="width:100%" value="${esc(CAI.key || '')}" placeholder="Paste the key here (starts with AQ. or AIza)" onchange="saveCompanyKey(this.value)"></div>
      <div><label>Model</label><input value="${esc(CAI.model || '')}" placeholder="auto" onchange="setAiModel(this.value.trim())" style="width:220px"></div>
      <button onclick="testKey()">Test key</button></div><div id="keyMsg">${V.keyMsg || ''}</div></div>`;
}
async function testKey() {
  const el = $('#keyMsg'); el.innerHTML = '<span class="spinner"></span> Checking…';
  if (!aiKey()) { el.innerHTML = '<div class="msg warn">Paste the key in the box first, click outside the box, then press Test key.</div>'; return; }
  try { const m = await pickModel(true); V.keyMsg = `<div class="msg ok">Key works. Using model ${esc(m)}.</div>`; }
  catch (e) { V.keyMsg = `<div class="msg bad">${esc(e.message)}</div>`; }
  render(); setTimeout(() => { V.keyMsg = ''; }, 100);
}
function exportData() {
  const blob = new Blob([JSON.stringify({ app:'S.A.W Woodworks', v:1, at:new Date().toISOString(), data: { ...S, settings: { ...S.settings, apiKey:'', geminiKey:'' } } })], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'saw-woodworks-backup-' + new Date().toISOString().slice(0,10) + '.json'; a.click();
}
function importData(f) {
  if (!f) return; const fr = new FileReader();
  fr.onload = () => { try { const j = JSON.parse(fr.result); if (!j.data || !Array.isArray(j.data.projects)) throw 0;
      if (!confirm(`Replace everything on this device with the backup from ${(j.at||'').slice(0,10)} (${j.data.projects.length} projects)?`)) return;
      const key = S.settings.apiKey, gk = S.settings.geminiKey; S = { settings: mergeSettings(j.data.settings), projects: j.data.projects }; S.settings.apiKey = key; S.settings.geminiKey = gk; save(); go('projects');
    } catch (e) { alert('That file is not an S.A.W Woodworks backup.'); } };
  fr.readAsText(f);
}

/* ============ start ============ */
(async function start() {
  await DB.open();
  const st = await DB.get('state');
  if (CLOUD) {
    LOCAL = st && st.projects && st.projects.length ? st : null;
    S = { settings: mergeSettings(null), projects: [] };
    $('#app').innerHTML = '<p class="muted">Connecting to the server…</p>';
    const go2 = () => { if (window.FB) startCloud(); else $('#app').innerHTML = `<div class="msg bad">Could not load the server connection (${esc(window.FB_ERROR && window.FB_ERROR.message || 'check your internet')}). Reload to try again.</div>`; };
    if (window.FB || window.FB_ERROR) go2(); else window.fbReady = go2;
    return;
  }
  S = { settings: mergeSettings(st && st.settings), projects: (st && st.projects) || [] };
  render(); termsGate();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
