<style>
:root{
  --bg:#f6f3ee;--card:#fff;--ink:#2b2520;--muted:#7a6f66;--line:#e2dbd2;
  --accent:#9a5b2a;--accent2:#c98a4b;--ok:#2f7d4f;--warn:#b7791f;--bad:#b23b3b;
  --ai:#fff4c2;--new:#e9c9a1;--keep:#d6d3cf;--repl:#f3c1c1;--blue:#3a78b5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#3b2a1d;color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;z-index:5}
header .logo{font-weight:800;letter-spacing:.5px;font-size:18px;cursor:pointer;display:flex;align-items:center;gap:8px}
header .logo span{background:var(--accent2);color:#3b2a1d;border-radius:6px;padding:2px 6px;font-size:13px}
header nav{margin-left:auto;display:flex;gap:6px}
header nav button{background:transparent;color:#fff;border:1px solid #ffffff44}
main{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:18px;margin:18px 0 8px}h3{font-size:15px;margin:12px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
button,.btn{font:inherit;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad);border-color:#e7b9b9}
button.small{padding:3px 8px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);max-width:100%}
input[type=number]{width:90px}
input.ai,select.ai{background:var(--ai);border-color:#e0c25a}
label{font-size:13px;color:var(--muted);display:block}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 14px}
.tabs button{border-radius:20px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.muted{color:var(--muted)}.small{font-size:13px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;font-size:14px;vertical-align:middle}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.tablewrap{overflow-x:auto}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photos figure button{position:absolute;top:4px;right:4px}
.msg{padding:9px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.msg.warn{background:#fff3dc;border:1px solid #f0d199}
.msg.bad{background:#fde8e8;border:1px solid #efb6b6}
.msg.ok{background:#e6f4ec;border:1px solid #b5dcc4}
.msg.ai{background:var(--ai);border:1px solid #e0c25a}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button.on{background:#3b2a1d;color:#fff}
svg{max-width:100%;height:auto;display:block}
.svgbox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;overflow:auto}
tr.sel td{background:#fbf1e4}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:12px}
.tag.new{background:var(--new)}.tag.keep{background:var(--keep)}.tag.replace{background:var(--repl)}.tag.ask{background:var(--ai)}
#modal .back{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal .box{background:#fff;border-radius:12px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.terms{max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px;background:#fcfbf9}
.big{font-size:28px;font-weight:800}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:640px){main{padding:10px}header nav button{padding:5px 8px;font-size:13px}}
@media print{header,.noprint,#modal{display:none!important}body{background:#fff}.card{border:none;padding:0;break-inside:avoid}main{max-width:none}}
</style>

<script>
/* ============ basics ============ */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const r0 = n => Math.round(n);
const TERMS_VERSION = 2;

const DEF_SETTINGS = {
  user: '', agreed: null, provider: 'gemini', geminiKey: '', apiKey: '', model: '',
  rules: { t:16, back:3, baseH:720, baseD:560, kick:100, worktop:32, wallH:720, wallD:320, wallElev:1450,
           tallH:2100, tallD:560, railW:100, shelfSet:20, gap:3, slide:26, drawerClear:60 },
  roles: { carcass:'m1', doors:'m1', backs:'m2', edgeCarcass:'e1', edgeDoors:'e2' },
  edges: [ { id:'e1', name:'Edging 1mm (cupboard fronts)', price:0 }, { id:'e2', name:'Edging 2mm (doors & fronts)', price:0 } ],
  hardware: [], labourRate: 0, markup: 0, edgeWaste: 10,
  materials: [
    { id:'m1', name:'White Melamine 16mm', L:2750, W:1830, kerf:4, trim:10, rotate:true },
    { id:'m2', name:'Hardboard 3mm (backs & drawer bottoms)', L:2440, W:1220, kerf:4, trim:5, rotate:true }
  ]
};

const TYPES = {
  base:     { label:'Base unit',      zone:'floor', w:600, doors:1, shelves:1, drawers:0 },
  sink:     { label:'Sink unit',      zone:'floor', w:900, doors:2, shelves:0, drawers:0 },
  drawer:   { label:'Drawer unit',    zone:'floor', w:500, doors:0, shelves:0, drawers:3 },
  wall:     { label:'Wall unit',      zone:'upper', w:600, doors:1, shelves:1, drawers:0 },
  tall:     { label:'Tall / pantry',  zone:'both',  w:600, doors:2, shelves:4, drawers:0 },
  wardrobe: { label:'Wardrobe (BIC)', zone:'both',  w:900, doors:2, shelves:1, drawers:0 },
  cornerBase: { label:'Blind corner base', zone:'floor', w:1000, doors:1, shelves:1, drawers:0, blind:450 },
  cornerWall: { label:'Blind corner wall', zone:'upper', w:900, doors:1, shelves:1, drawers:0, blind:330 }
};
const STATUS = { new:'New', keep:'Keep existing', replace:'Replace existing', ask:'Existing – decide' };
const SHAPES = { straight:['One wall',1], L:['L-shape',2], U:['U-shape',3], rect:['Full room (4 walls)',4] };

/* ============ storage ============ */
const DB = {
  db: null,
  open() { return new Promise(res => { try { const r = indexedDB.open('sawwoodworks', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => res(); } catch(e) { res(); } }); },
  get(k) { return new Promise(res => {
    if (!this.db) { try { res(JSON.parse(localStorage.getItem('sww_'+k))); } catch(e) { res(null); } return; }
    const q = this.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  set(k, v) { return new Promise(res => {
    if (!this.db) { try { localStorage.setItem('sww_'+k, JSON.stringify(v)); } catch(e) {} res(); return; }
    const tx = this.db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => res(); }); }
};

let S = { settings: null, projects: [] };
let V = { view:'projects', pid:null, rid:null, tab:'photos', wall:0, sel:null, busy:false, aiMsg:'' };
let saveT;
/* ============ Firebase cloud: root-managed users, per-user jobs, letterheads ============ */
const CLOUD = !!window.FIREBASE_CONFIG;
let ME = null, ROOT = null, DU = null, LH = null, LHD = null, LOCAL = null, USERS = [];
let unsubs = [], dataSubs = [], photoSub = null, photoSubKey = null, pendingRender = false;
let PHOTOS = {};
let SENT = { projects:{}, settings:'' };
const isRoot = () => CLOUD && !!ME && ME.role === 'root';
const dataUid = () => (isRoot() && V.as) || (ME && ME.uid);
const lhVisible = () => CLOUD && !!ME && (isRoot() || (DU && !DU.lhLocked));
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { saveT = null; if (CLOUD) { if (ME && ME.role) cloudFlush(); } else DB.set('state', JSON.parse(JSON.stringify(S))); }, 250);
}
const cpath = (...p) => ['users', dataUid(), ...p].join('/');
const fbErr = e => { console.error(e); toast('⚠ Could not save to the server: ' + (e.code || e.message)); };
function toast(t) { let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#3b2a1d;color:#fff;padding:9px 14px;border-radius:8px;z-index:30;font-size:14px;max-width:90vw'; document.body.appendChild(el); } el.textContent = t; el.style.display = 'block'; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 4500); }
function cloudSettings() { const s = { ...S.settings }; delete s.user; delete s.agreed; return JSON.stringify(s); }
function defaultSettings() { const s = mergeSettings(null); delete s.user; delete s.agreed; return JSON.parse(JSON.stringify(s)); }
function cloudFlush() {
  const { F, db } = FB, ids = new Set();
  S.projects.forEach(p => {
    ids.add(p.id); const j = JSON.stringify(p);
    if (SENT.projects[p.id] !== j) { SENT.projects[p.id] = j; F.setDoc(F.doc(db, cpath('projects', p.id)), JSON.parse(j)).catch(fbErr); }
  });
  Object.keys(SENT.projects).forEach(id => { if (!ids.has(id)) { delete SENT.projects[id]; F.deleteDoc(F.doc(db, cpath('projects', id))).catch(fbErr); deleteProjectPhotos(id); } });
  const st = cloudSettings();
  if (st !== SENT.settings) { SENT.settings = st; F.updateDoc(F.doc(db, 'users/' + dataUid()), { settings: JSON.parse(st) }).catch(fbErr); }
}
async function deleteProjectPhotos(pid) {
  const { F, db } = FB;
  try { const qs = await F.getDocs(F.query(F.collection(db, cpath('photos')), F.where('pid', '==', pid))); qs.docs.forEach(d => F.deleteDoc(d.ref).catch(() => {})); } catch (e) {}
}
function softRender() {
  const a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && !$('#modal').contains(a)) { pendingRender = true; return; }
  render();
}
document.addEventListener('focusout', () => { if (pendingRender) { pendingRender = false; setTimeout(render, 0); } });

/* ---- passwords: letters + numbers + special characters ---- */
function pwProblem(p) {
  if (!p || p.length < 8) return 'Password must be at least 8 characters.';
  if (!/[A-Za-z]/.test(p)) return 'Password must contain at least one letter.';
  if (!/[0-9]/.test(p)) return 'Password must contain at least one number.';
  if (!/[^A-Za-z0-9]/.test(p)) return 'Password must contain at least one special character, e.g. ! @ # $ % & * ?';
  return null;
}
function genPw() {
  const sets = ['ABCDEFGHJKLMNPQRSTUVWXYZ', 'abcdefghijkmnpqrstuvwxyz', '23456789', '!@#$%&*?'];
  const r = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
  const a = sets.map(s => s[r(s.length)]);
  while (a.length < 12) { const s = sets[r(4)]; a.push(s[r(s.length)]); }
  for (let i = a.length - 1; i > 0; i--) { const j = r(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a.join('');
}
const PW_HINT = 'At least 8 characters, with letters, numbers and a special character (e.g. ! @ # $ %).';

/* ---- example jobs every new account starts with ---- */
function demoProjects() {
  const R0 = DEF_SETTINGS.rules, id = () => uid() + uid();
  const U = (type, x, w, extra = {}) => { const t = TYPES[type];
    return { id:id(), type, x, w, h: type==='wall' ? R0.wallH : (t.zone==='both' ? R0.tallH : R0.baseH), d: type==='wall' ? R0.wallD : (t.zone==='both' ? R0.tallD : R0.baseD),
      elev: type==='wall' ? R0.wallElev : 0, doors:t.doors, shelves:t.shelves, drawers:t.drawers, status:'new', ...extra }; };
  const W = (label, length, extra = {}) => ({ id:id(), label, length, height:2400, turn:'right', openings:[], units:[], ...extra });
  const now = new Date().toISOString();
  const kA = W('A', 3600, { openings:[{ id:id(), type:'window', x:1300, w:1000, h:1000, sill:1100 }],
    units:[U('drawer',0,500), U('base',500,600), U('sink',1100,900), U('base',2000,600), U('base',2600,1000,{doors:2}),
           U('wall',0,500), U('wall',500,600), U('wall',2400,600), U('wall',3000,600)] });
  const kB = W('B', 2600, { openings:[{ id:id(), type:'door', x:1700, w:813, h:2032, sill:0 }],
    units:[U('tall',0,600), U('base',600,600,{status:'keep'}), U('wall',600,600)] });
  const bA = W('A', 2700, { units:[U('wardrobe',0,900), U('wardrobe',900,900,{drawers:2}), U('wardrobe',1800,900)] });
  return [{ id:id(), name:'Example – Smith kitchen & bedroom', client:'Example client', addr:'12 Sample Street', created:now, updated:now, example:true,
    rooms:[{ id:id(), name:'Kitchen', photos:[], shape:'L', walls:[kA, kB], ai:null, mats:null },
           { id:id(), name:'Main bedroom BIC', photos:[], shape:'straight', walls:[bA], ai:null, mats:null }] }];
}

/* ---- start / auth ---- */
function startCloud() {
  FB.A.onAuthStateChanged(FB.auth, async u => {
    unsubs.forEach(f => f()); unsubs = []; detachData();
    ME = null; ROOT = null; USERS = []; V.as = null;
    if (!u) { modal(''); go('login'); refreshRootFlag(); return; }
    ME = { uid:u.uid, email:u.email };
    await loadMe();
  });
}
async function refreshRootFlag() {
  try { const c = await FB.F.getDoc(FB.F.doc(FB.db, 'config/app')); ROOT = c.exists() ? c.data().root : null; } catch (e) { ROOT = 'unknown'; }
  if (V.view === 'login') render();
}
async function loadMe() {
  const { F, db } = FB;
  try { const c = await F.getDoc(F.doc(db, 'config/app')); ROOT = c.exists() ? c.data().root : null; } catch (e) { ROOT = null; }
  let us = null; try { us = await F.getDoc(F.doc(db, 'users/' + ME.uid)); } catch (e) {}
  if (!us || !us.exists()) { go(ROOT ? 'noaccess' : 'bootstrap'); return; }
  Object.assign(ME, us.data());
  if (ME.active === false) { go('blocked'); return; }
  S.settings = mergeSettings(ME.settings); S.settings.user = ME.name; S.settings.agreed = ME.agreed || null;
  if (isRoot()) unsubs.push(F.onSnapshot(F.collection(db, 'users'), qs => { USERS = qs.docs.map(d => ({ uid:d.id, ...d.data() })); if (V.view === 'users') softRender(); }, () => {}));
  attachData(true);
}
function detachData() { dataSubs.forEach(f => f()); dataSubs = []; if (photoSub) photoSub(); photoSub = null; photoSubKey = null;
  S.projects = []; SENT = { projects:{}, settings:'' }; PHOTOS = {}; DU = null; LH = null; LHD = null; }
function attachData(first) {
  detachData();
  const { F, db } = FB, u = dataUid();
  let gotUser = false;
  dataSubs.push(F.onSnapshot(F.doc(db, 'users/' + u), snap => {
    DU = snap.data() || {};
    if (u === ME.uid) {
      Object.assign(ME, DU);
      if (DU.active === false) { toast('Your account has been blocked. Contact the administrator.'); FB.A.signOut(FB.auth); return; }
    }
    if (!saveT || cloudSettings() === SENT.settings) {
      S.settings = Object.assign(mergeSettings(DU.settings), { user:ME.name, agreed:ME.agreed || null });
      SENT.settings = cloudSettings();
    }
    if (!gotUser) { gotUser = true;
      if (first) { V.view = (!isRoot() && !DU.lhLocked) ? 'letterhead' : 'projects'; render(); termsGate(); } else render();
    } else softRender();
  }, e => toast('Server error: ' + e.code)));
  dataSubs.push(F.onSnapshot(F.doc(db, 'users/' + u + '/meta/letterhead'), snap => { LH = snap.exists() ? snap.data() : null; if (!LHD || V.view !== 'letterhead') LHD = null; renderHeader(); if (gotUser) softRender(); }, () => {}));
  dataSubs.push(F.onSnapshot(F.collection(db, 'users/' + u + '/projects'), qs => {
    qs.docChanges().forEach(ch => {
      const id = ch.doc.id, local = S.projects.find(p => p.id === id);
      if (ch.type === 'removed') { S.projects = S.projects.filter(p => p.id !== id); delete SENT.projects[id]; return; }
      const data = ch.doc.data(), j = JSON.stringify(data);
      if (local && saveT && JSON.stringify(local) !== SENT.projects[id]) return;
      SENT.projects[id] = j;
      if (local) { Object.keys(local).forEach(k => delete local[k]); Object.assign(local, data); } else S.projects.push(data);
    });
    if (gotUser && !['login','setup','bootstrap'].includes(V.view)) softRender();
  }, e => toast('Server error: ' + e.code)));
}
function watchPhotos(pid) {
  const key = dataUid() + '/' + pid;
  if (!CLOUD || !ME || !ME.role || photoSubKey === key) return;
  if (photoSub) photoSub(); photoSubKey = key;
  const { F, db } = FB;
  photoSub = F.onSnapshot(F.query(F.collection(db, cpath('photos')), F.where('pid', '==', pid)), qs => {
    let changed = false;
    qs.docChanges().forEach(ch => { if (ch.type === 'removed') delete PHOTOS[ch.doc.id]; else PHOTOS[ch.doc.id] = ch.doc.data().data; changed = true; });
    if (changed && V.view === 'room' && V.tab === 'photos') softRender();
  }, () => {});
}
const photoSrc = x => typeof x === 'string' && x.startsWith('ph:') ? PHOTOS[x.slice(3)] : x;

/* ---- login / first-time root / no access ---- */
function viewLogin() {
  return `<div class="card" style="max-width:420px;margin:30px auto">
    <h1 style="margin-top:0">Sign in</h1>
    <label>Email</label><input id="lgE" type="email" autocomplete="username" style="width:100%">
    <label style="margin-top:8px">Password</label><input id="lgP" type="password" autocomplete="current-password" style="width:100%" onkeydown="if(event.key==='Enter')doLogin()">
    <div id="lgMsg"></div>
    <div class="row" style="margin-top:12px"><button class="primary" onclick="doLogin()">Sign in</button>
    <button class="small" style="border:none;color:var(--accent)" onclick="doReset()">Forgot password?</button></div>
    ${ROOT === null ? `<hr style="border:none;border-top:1px solid var(--line);margin:16px 0"><p class="small"><b>First time setting up Saw Wood Works?</b> Type the email and password for the <b>root (administrator)</b> account above, then press:</p>
      <button onclick="doRootSignup()">Create root account</button><p class="small muted">${PW_HINT}</p>`
      : `<p class="small muted">Accounts are created by the administrator.</p>`}</div>`;
}
const authMsg = e => ({ 'auth/invalid-credential':'Wrong email or password.', 'auth/wrong-password':'Wrong email or password.', 'auth/user-not-found':'Wrong email or password.',
  'auth/email-already-in-use':'That email already has a login.', 'auth/weak-password':PW_HINT, 'auth/password-does-not-meet-requirements':PW_HINT, 'auth/invalid-email':'That email address is not valid.',
  'auth/too-many-requests':'Too many tries — wait a few minutes and try again.', 'auth/network-request-failed':'No internet connection.' }[e.code] || e.message);
function lgVals() { return [$('#lgE').value.trim(), $('#lgP').value]; }
function lgShow(t, k = 'bad') { $('#lgMsg').innerHTML = `<div class="msg ${k}">${esc(t)}</div>`; }
async function doLogin() { const [e, p] = lgVals(); if (!e || !p) return lgShow('Enter your email and password.'); try { await FB.A.signInWithEmailAndPassword(FB.auth, e, p); } catch (x) { lgShow(authMsg(x)); } }

/* --- cabinet template formulas (Optimik): dim 1=width 2=height 3=depth; op 1 = minus, 10 = plus, 2..9 = divide by N, 11+ = times (N-9); values in 1/100 mm --- */
function tplEval(f, X, Y, Z, def) {
  if (!f) return def;
  const t = f.split(' ').map(Number); let v = { 0:0, 1:X, 2:Y, 3:Z }[t[0]]; if (v === undefined) return def;
  for (let i = 1; i + 1 < t.length; i += 2) { const o = t[i], a = t[i + 1] / 100;
    if (!o) continue; if (o === 1) v -= a; else if (o === 10) v += a; else if (o >= 2 && o <= 9) v = a ? v / a : v / o; else if (o >= 11) v *= (o - 9); }
  return r0(v);
}
function tplParts(tpl, W, H, D) {
  return tpl.parts.map(s => { const [name, cs, cv, sd, vd, qty, matId, edges, rot] = s.split('|');
    return { name, L:tplEval(cs, W, H, D, +sd), W:tplEval(cv, W, H, D, +vd), qty:+qty || 1, matId, edges, rot:rot === '1' }; }).filter(p => p.L > 0 && p.W > 0);
}
function tplZone(t) { return /^\W*(wall|wand|muur)/i.test(t.name) ? 'upper' : (t.Y >= 1500 ? 'both' : 'floor'); }
function addLibMaterials(ids) { const used = new Set(ids);
  (LIBX ? LIBX.materials : []).forEach(m => { if (used.has(m.id) && !S.settings.materials.some(x => x.id === m.id)) S.settings.materials.push({ id:m.id, name:m.name, L:m.L, W:m.W, kerf:m.kerf, trim:m.trim, rotate:m.rotate, price:m.price ? sheetPrice(m.price, m) : 0 }); }); }

/* ============ sheet optimiser (MaxRects, best short side fit) ============ */
class Bin {

      if (n.x > f.x) nf.push({ x:f.x, y:f.y, w:n.x-f.x, h:f.h });
      if (n.x+n.w < f.x+f.w) nf.push({ x:n.x+n.w, y:f.y, w:f.x+f.w-n.x-n.w, h:f.h });
      if (n.y > f.y) nf.push({ x:f.x, y:f.y, w:f.w, h:n.y-f.y });
      if (n.y+n.h < f.y+f.h) nf.push({ x:f.x, y:n.y+n.h, w:f.w, h:f.y+f.h-n.y-n.h });
    }
    this.free = nf.filter((a, i) => !nf.some((b, j) => j !== i && a.x >= b.x && a.y >= b.y && a.x+a.w <= b.x+b.w && a.y+a.h <= b.y+b.h && (j < i || a.x!==b.x || a.y!==b.y || a.w!==b.w || a.h!==b.h)));

  }
}
function packMaterial(parts, m) {

  items.sort((a, b) => Math.max(b.L,b.W) - Math.max(a.L,a.W) || b.L*b.W - a.L*a.W);

/* ============ checks ============ */
function wallWarnings(w) {
  const out = [], L = +w.length, Rl = R_();
  if (!L) { out.push(['bad', `Wall ${w.label}: fill in the wall length.`]); return out; }
  const H = +w.height || 2400;
  w.units.forEach(u => {
    const ref = unitRef(w, u), x = +u.x, e = x + (+u.w);
    if (e > L) out.push(['bad', `${ref} runs ${r0(e - L)} mm past the end of wall ${w.label}.`]);
    if (x < 0) out.push(['bad', `${ref} starts before the wall (x is negative).`]);
    const z = zoneOf(u);
    const top = z === 'upper' ? (+u.elev + +u.h) : (Rl.kick + +u.h + (z === 'floor' ? Rl.worktop : 0));
    if (top > H) out.push(['warn', `${ref} is ${r0(top - H)} mm higher than the ceiling height.`]);
    w.openings.forEach(o => {
      const ox = +o.x, oe = ox + (+o.w);
      if (e <= ox || x >= oe) return;
      const oz0 = o.type === 'door' ? 0 : +o.sill, oz1 = oz0 + (+o.h);
      const uz0 = z === 'upper' ? +u.elev : 0, uz1 = z === 'upper' ? +u.elev + +u.h : top;
      if (uz0 < oz1 && uz1 > oz0) out.push(['warn', `${ref} overlaps the ${o.type} on wall ${w.label}.`]);
    });
  });
  for (let i = 0; i < w.units.length; i++) for (let j = i+1; j < w.units.length; j++) {
    const a = w.units[i], b = w.units[j];
    if (!lanes(a).some(l => lanes(b).includes(l))) continue;
    if (+a.x < +b.x + +b.w && +b.x < +a.x + +a.w) out.push(['bad', `${unitRef(w,a)} and ${unitRef(w,b)} overlap.`]);
  }
  const fe = laneEnd(w, 'base');
  if (w.units.some(u => lanes(u).includes('floor')) && L - fe > 0) out.push(['ok', `${r0(L - fe)} mm free at the end of the floor run on wall ${w.label}.`]);
  return out;
}

const DIRS = [[1,0],[0,1],[-1,0],[0,-1]];

}

    if (nr && nd) g += `<line x1="${x}" x2="${x+uw}" y1="${Y(z0+uh/2)}" y2="${Y(z0+uh/2)}" stroke="#6b4a2e" vector-effect="non-scaling-stroke"/>`;
    for (let i = 1; i < nd; i++) g += `<line x1="${x+uw*i/nd}" x2="${x+uw*i/nd}" y1="${Y(z0 + (uh-drawerZone))}" y2="${Y(z0)}" stroke="#6b4a2e" vector-effect="non-scaling-stroke"/>`;

    g += `<text x="${x+uw/2}" y="${Y(z0+uh/2)}" font-size="${fs*0.8}" text-anchor="middle" dominant-baseline="middle" font-weight="700" fill="#3b2a1d">${esc(unitRef(w,u))}</text>`;
    g += `<text x="${x+uw/2}" y="${Y(z0+uh/2)+fs}" font-size="${fs*0.6}" text-anchor="middle" fill="#3b2a1d">${r0(uw)}</text></g>`;

function shrink(file) {
  return new Promise(res => {
    const fr = new FileReader();

      c.width = r0(img.width*s); c.height = r0(img.height*s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', CLOUD ? 0.75 : 0.82)); }; img.onerror = () => res(null); img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

/* AI — Google Gemini (free tier) or Anthropic Claude (paid) */
const aiKey = () => (S.settings.provider === 'anthropic' ? S.settings.apiKey : S.settings.geminiKey || '').trim();
function apiHeaders() { return { 'content-type':'application/json', 'x-api-key':S.settings.apiKey.trim(), 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' }; }
const gHeaders = () => ({ 'content-type':'application/json', 'x-goog-api-key': (S.settings.geminiKey||'').trim() });
async function pickModel(force) {
  if (S.settings.model && !force) return S.settings.model;
  let m;
  if (S.settings.provider === 'anthropic') {
    const r = await fetch('https://api.anthropic.com/v1/models?limit=50', { headers: apiHeaders() });
    const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || ('HTTP ' + r.status));
    const ids = (j.data || []).map(x => x.id);
    m = ids.find(i => /sonnet/i.test(i)) || ids[0];
  } else {
    const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { headers: gHeaders() });
    const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || ('HTTP ' + r.status));
    const ok = (j.models || []).filter(x => (x.supportedGenerationMethods || []).includes('generateContent'))
      .map(x => x.name.replace('models/', ''))
      .filter(n => /^gemini-[\d.]+-flash/.test(n) && !/image|tts|live|audio|thinking|exp|lite/.test(n));
    const ver = n => parseFloat((n.match(/gemini-([\d.]+)/) || [0, 0])[1]);
    ok.sort((a, b) => ver(b) - ver(a) || (/preview/.test(a) - /preview/.test(b)) || a.length - b.length);
    m = ok[0];
  }
  if (!m) throw new Error('No suitable model available on this key.');
  S.settings.model = m; save(); return m;
}

  try {
    const model = await pickModel();
    const prompt = `You are helping a South African cabinet maker measure a room for built-in cupboards. These photos show one room (ideally one photo per wall). Work out:
- how many walls will get cupboards (1 = straight, 2 = L-shape, 3 = U-shape, 4 = full room), labelled A, B, C, D going clockwise, starting with the wall in the first photo
- for each wall: estimated length and ceiling height in mm, doors and windows (offset from the LEFT end of the wall as seen from inside the room, width, height, and sill height for windows)
- existing cupboards on each wall: type (base, sink, drawer, wall, tall, wardrobe), offset from the left in mm, width in mm, number of doors and drawers
Use common sizes as scale references: internal doors are about 813 wide x 2032 high, kitchen worktops about 900 from the floor, base units about 560 deep, wall units about 720 high. If you cannot tell a value, use null. Round to the nearest 10 mm.
Reply with ONLY JSON, no other text, in this shape:
{"walls":[{"label":"A","lengthMm":3200,"heightMm":2400,"openings":[{"type":"door","offsetMm":0,"widthMm":813,"heightMm":2032,"sillMm":0}],"existing":[{"type":"base","offsetMm":900,"widthMm":600,"doors":1,"drawers":0}]}],"notes":"short notes on anything the cabinet maker must measure or check"}`;
    const photos = r.photos.map(photoSrc).filter(Boolean).slice(0, 8).map(d => d.split(',')[1]);
    if (!photos.length) throw new Error('photos are still loading — try again in a moment');
    let txt = '';
    if (S.settings.provider === 'anthropic') {
      const resp = await fetch('https://api.anthropic.com/v1/messages', { method:'POST', headers: apiHeaders(),
        body: JSON.stringify({ model, max_tokens: 3000, messages:[{ role:'user', content:[...photos.map(data => ({ type:'image', source:{ type:'base64', media_type:'image/jpeg', data } })), { type:'text', text:prompt }] }] }) });
      const j = await resp.json(); if (!resp.ok) throw new Error(j.error?.message || ('HTTP ' + resp.status));
      txt = (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
    } else {
      const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, { method:'POST', headers: gHeaders(),
        body: JSON.stringify({ contents:[{ role:'user', parts:[...photos.map(data => ({ inline_data:{ mime_type:'image/jpeg', data } })), { text:prompt }] }],
                               generationConfig:{ responseMimeType:'application/json', temperature:0.2 } }) });
      const j = await resp.json();
      if (!resp.ok) throw new Error(resp.status === 429 ? 'free daily limit reached — try again later' : (j.error?.message || ('HTTP ' + resp.status)));
      txt = ((j.candidates || [])[0]?.content?.parts || []).map(p => p.text || '').join('');
    }
    const js = JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
    const n = applyAI(r, js);
    V.aiMsg = `✔ AI found ${r.walls.length} wall(s) and ${n} existing cupboard(s). Yellow boxes are guesses — measure and correct them.`;
    touch(); V.busy = false; V.tab = 'room'; render(); nextAsk();
  } catch (e) { V.busy = false; V.aiMsg = 'AI could not read the photos: ' + e.message; render(); }
}
function applyAI(r, js) {
  const aw = (js.walls || []).slice(0, 4); if (!aw.length) throw new Error('no walls in the reply');
  r.shape = ['straight','L','U','rect'][aw.length - 1];
  while (r.walls.length < aw.length) r.walls.push(newWall(r.walls.length));
  r.walls.length = Math.max(aw.length, 1);
  r.ai = { notes: js.notes || '', flags: {} };
  let count = 0;
  aw.forEach((a, i) => {
    const w = r.walls[i];
    if (!w.length && num(a.lengthMm)) { w.length = r0(num(a.lengthMm)); r.ai.flags['len_'+w.id] = 1; }
    if (num(a.heightMm) && (!w.height || w.height === 2400)) { w.height = r0(num(a.heightMm)); r.ai.flags['h_'+w.id] = 1; }
    if (!w.openings.length) (a.openings || []).forEach(o => {
      if (!['door','window'].includes(o.type)) return;
      w.openings.push({ id:uid(), type:o.type, x:r0(num(o.offsetMm)||0), w:r0(num(o.widthMm)||(o.type==='door'?813:1000)), h:r0(num(o.heightMm)||(o.type==='door'?2032:1000)), sill:r0(num(o.sillMm)||(o.type==='door'?0:900)), ai:true });
    });
    (a.existing || []).forEach(e => {
      const type = TYPES[e.type] ? e.type : 'base';
      const u = unitDefaults(type);
      Object.assign(u, { x:r0(num(e.offsetMm)||0), w:r0(num(e.widthMm)||u.w), doors: num(e.doors) ?? u.doors, drawers: num(e.drawers) ?? u.drawers, status:'ask', ai:true });
      w.units.push(u); count++;
    });
  });
  return count;
}
function aiCls(key, obj) { const r = R(); return (obj && obj.ai) || (r.ai && r.ai.flags && r.ai.flags[key]) ? 'ai' : ''; }
function clearAi(key) { const r = R(); if (r.ai && r.ai.flags) delete r.ai.flags[key]; }

/* existing cupboard decision */
function nextAsk() {
  const r = R(); if (!r) return;
  for (const w of r.walls) for (const u of w.units) if (u.status === 'ask') {
    modal(`<h2 style="margin-top:0">Existing cupboard found</h2>
      <p><b>${esc(unitRef(w,u))}</b> on wall ${esc(w.label)} — ${esc(typeLabel(u))}, ${r0(u.w)} mm wide, ${r0(u.x)} mm from the left.</p>
      <div class="svgbox" style="margin-bottom:10px">${elevSVG(r, w, { maxH:220 })}</div>
      <p>Do you want to keep it or replace it?</p>
      <div class="row"><button class="primary" onclick="decide('${w.id}','${u.id}','keep')">Keep it</button>
      <button class="primary" style="background:var(--bad);border-color:var(--bad)" onclick="decide('${w.id}','${u.id}','replace')">Replace with new</button>
      <button onclick="decide('${w.id}','${u.id}','remove')">Remove (rip out, nothing new)</button>
      <button onclick="modal('')">Decide later</button></div>`);

  }

}
function decide(wid, id, what) {
  const w = R().walls.find(x => x.id === wid), u = w.units.find(x => x.id === id);
  if (what === 'remove') w.units = w.units.filter(x => x !== u); else u.status = what;
  touch(); render(); nextAsk();
}

function setWall(i, f, v, flag) { const w = R().walls[i]; w[f] = num(v); clearAi(flag + w.id); touch(); render(); }
function setOpen(i, j, f, v) { const o = R().walls[i].openings[j]; o[f] = num(v) ?? 0; delete o.ai; touch(); render(); }
function addOpening(i, type) { R().walls[i].openings.push({ id:uid(), type, x:0, w:type==='door'?813:1000, h:type==='door'?2032:1000, sill:type==='door'?0:1000 }); touch(); render(); }

function curWall() { return R().walls[V.wall]; }
function addUnit(type) { const w = curWall(), u = unitDefaults(type); u.x = laneEnd(w, type); w.units.push(u); V.sel = u.id; touch(); render(); }
function addExisting() { const w = curWall(), u = unitDefaults('base'); u.x = laneEnd(w, 'base'); u.status = 'ask'; w.units.push(u); V.sel = u.id; touch(); render();
  modal(`<h2 style="margin-top:0">Existing cupboard added</h2><p>Set its type, position and width in the table, then choose <b>Keep</b> or <b>Replace</b> in the Status column — or decide now:</p>

function setUnit(j, f, v) {
  const u = curWall().units[j];
  if (f === 'type') {

  } else if (f === 'status' || f === 'zone') { u[f] = v; if (f === 'zone') u.elev = v === 'upper' ? R_().wallElev : 0; }
  else { u[f] = num(v) ?? 0; if (f === 'x' || f === 'w') delete u.ai; }
  V.sel = u.id; touch(); render();
}
function delUnit(j) { curWall().units.splice(j, 1); V.sel = null; touch(); render(); }

    <button onclick="exportData()">⬇ Download backup</button>
    <label class="btn">⬆ Restore backup<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])"></label></div></div>
  <div class="card"><h3 style="margin-top:0">Terms &amp; Conditions</h3><p class="small">Accepted by <b>${esc(s.agreed?.by||'')}</b> on ${esc((s.agreed?.at||'').slice(0,10))}.</p>
    <details><summary>Read terms</summary><div class="terms">${TERMS_HTML()}</div></details></div>`;
}
function delMat(i) {
  const m = S.settings.materials[i];
  if (S.settings.materials.length < 2) return alert('You need at least one material.');
  if (!confirm('Delete ' + m.name + '?')) return;
  S.settings.materials.splice(i, 1);
  const first = S.settings.materials[0].id;
  Object.keys(S.settings.roles).forEach(k => { if (S.settings.roles[k] === m.id) S.settings.roles[k] = first; });
  save(); render();
}
async function testKey() {
  const el = $('#keyMsg'); el.innerHTML = '<span class="spinner"></span> Checking…';
  try { const m = await pickModel(true); render(); $('#keyMsg').innerHTML = `<div class="msg ok">Key works. Using model ${esc(m)}.</div>`; }
  catch (e) { el.innerHTML = `<div class="msg bad">${esc(e.message)}</div>`; }
}
function exportData() {
  const blob = new Blob([JSON.stringify({ app:'Saw Wood Works', v:1, at:new Date().toISOString(), data: { ...S, settings: { ...S.settings, apiKey:'', geminiKey:'' } } })], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'saw-wood-works-backup-' + new Date().toISOString().slice(0,10) + '.json'; a.click();
}
function importData(f) {
  if (!f) return; const fr = new FileReader();
  fr.onload = () => { try { const j = JSON.parse(fr.result); if (!j.data || !Array.isArray(j.data.projects)) throw 0;
      if (!confirm(`Replace everything on this device with the backup from ${(j.at||'').slice(0,10)} (${j.data.projects.length} projects)?`)) return;
      const key = S.settings.apiKey, gk = S.settings.geminiKey; S = { settings: mergeSettings(j.data.settings), projects: j.data.projects }; S.settings.apiKey = key; S.settings.geminiKey = gk; save(); go('projects');
    } catch (e) { alert('That file is not a Saw Wood Works backup.'); } };
  fr.readAsText(f);
}

/* ============ start ============ */
(async function start() {
  await DB.open();
  const st = await DB.get('state');
  if (CLOUD) {
    LOCAL = st && st.projects && st.projects.length ? st : null;
    S = { settings: mergeSettings(null), projects: [] };
    $('#app').innerHTML = '<p class="muted">Connecting to the server…</p>';
    const go2 = () => { if (window.FB) startCloud(); else $('#app').innerHTML = `<div class="msg bad">Could not load the server connection (${esc(window.FB_ERROR && window.FB_ERROR.message || 'check your internet')}). Reload to try again.</div>`; };
    if (window.FB || window.FB_ERROR) go2(); else window.fbReady = go2;
    return;
  }
  S = { settings: mergeSettings(st && st.settings), projects: (st && st.projects) || [] };
  render(); termsGate();
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
